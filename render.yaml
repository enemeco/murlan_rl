# Best-effort self-ping does not preserve data across restarts or redeploys.
services:
  - type: web
    name: murlan-rl
    runtime: docker
    branch: main
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: MURLAN_ONLINE_LEARNING
        value: "1"
      - key: MURLAN_TORCH_THREADS
        value: "1"
      - key: MURLAN_SELF_PING
        value: "1"
