# Best-effort self-ping does not preserve data across restarts or redeploys.
# For accepted-model persistence, follow GITHUB_MODEL_SETUP.md and set
# MURLAN_GITHUB_SYNC=1 plus MURLAN_GITHUB_TOKEN in the Render dashboard.
# Keep the token out of this file. GitHub saving is opt-in (default: disabled).
services:
  - type: web
    name: murlan-rl
    runtime: docker
    branch: main
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: MURLAN_ONLINE_LEARNING
        value: "1"
      - key: MURLAN_TORCH_THREADS
        value: "1"
      - key: MURLAN_SELF_PING
        value: "1"
